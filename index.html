<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIS Final Exam Prep</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>AIS Study App</h1>
      <div class="stats">
        <span>Streak: <strong id="streak">🔥 0</strong></span>
        <span>Score: <strong id="score">0 / 30</strong></span>
      </div>
    </header>

    <div class="progress-bar-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <main id="quiz-container">
      <div id="question-text">Loading question...</div>
      <div id="options-container"></div>
      <div id="feedback-text"></div>
    </main>

    <div class="cta-container">
      <a href="https://github.com/your-username/your-repo-name" target="_blank" class="github-btn">⭐ Star on GitHub</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
